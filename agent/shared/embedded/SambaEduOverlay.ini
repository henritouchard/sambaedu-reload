; Adaptateur RENDER (Windows / Rainmeter) du POC overlay SambaEdu.
;
; Lit le fichier local overlay.json (écrit par l'AGENT desired-state, Story 24.4)
; et affiche identité + machine + la 1re alerte dans un panneau épinglé en
; haut-droite de l'écran. Aucun secret ici : la facade = le fichier local.
;
; Fond = meter Shape (coins arrondis) → aucun binaire à distribuer.
; Parsing par WebParser + regex (zéro dépendance, robuste tant que l'ordre des
; clés du contrat est stable). Pour la liste COMPLÈTE des alertes, préférer la
; variante JsonParser.dll (cf. README) ou Conky côté Linux.
;
; POC — cf. resources/overlay/README.md.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
; Épingle le panneau en haut-droite de la zone de travail à chaque (re)chargement.
; Story 27.1bis : le verrouillage DUR (Draggable=0 / ClickThrough=1 /
; KeepOnScreen=1 + position d'instance, TrayIcon=0) vit dans le Rainmeter.ini
; (settings d'instance) posé par l'agent sous C:\ProgramData\SambaEdu\Rainmeter\
; en ACL Users:R — la skin SEULE ne suffit pas à verrouiller. Ici, on conserve
; uniquement le !Move au refresh (recale la position au (re)chargement) ; les
; bangs de verrouillage ne sont PAS dans la skin (ils seraient réécrits par un
; élève qui éditerait sa copie de skin si elle était modifiable — la défense
; réelle est l'ACL ProgramData + le Rainmeter.ini durci).
OnRefreshAction=[!Move "(#SCREENAREAWIDTH#-#PanelW#-24)" "24"]

[Metadata]
Name=SambaEduOverlay
Author=SambaEdu
Information=Overlay session SambaEdu — identité, machine, alertes
Version=0.2-poc

[Variables]
; Chemin du fichier local écrit PER-USER par le compagnon agent (Story 24.4).
; Slashes avant pour file:// ; Rainmeter expanse les variables d'environnement.
JsonPath=%LOCALAPPDATA%/SambaEdu/Agent/overlay.json
; Cadence de relecture du fichier (× Update 1 s) ≤ ttl_seconds du fetch.
PollSeconds=10

; --- Thème / géométrie du panneau (inspiré du sample illustro) ---
FontFace=Segoe UI
PanelW=360
Pad=16
HeaderH=70
; Couleurs (r,g,b,a)
ColBg=18,20,26,210
ColText=255,255,255,255
ColSub=255,255,255,170

; ============================ MEASURES ============================

; Identité + machine (un seul match, ordre des clés du contrat).
[mIdentity]
Measure=WebParser
URL=file:///#JsonPath#
RegExp=(?siU)"fullname": "(.*)".*"name": "(.*)".*"room": "(.*)".*"alerts":
UpdateRate=#PollSeconds#

[mFullname]
Measure=WebParser
URL=[mIdentity]
StringIndex=1

[mMachine]
Measure=WebParser
URL=[mIdentity]
StringIndex=2

[mRoom]
Measure=WebParser
URL=[mIdentity]
StringIndex=3

; Première alerte (severity / title / text).
[mAlert]
Measure=WebParser
URL=file:///#JsonPath#
RegExp=(?siU)"severity": "(.*)".*"title": "(.*)".*"text": "(.*)"
UpdateRate=#PollSeconds#

[mAlertSeverity]
Measure=WebParser
URL=[mAlert]
StringIndex=1
RegExpSubstitute=1
; severity → couleur RGB.
Substitute="^info$":"50,120,215","^warning$":"230,140,30","^critical$":"200,30,30","^$":"0,0,0"

[mAlertTitle]
Measure=WebParser
URL=[mAlert]
StringIndex=2
; Masque la carte d'alerte (fond + textes) quand il n'y a pas d'alerte.
IfMatch=^$
IfMatchAction=[!HideMeter BgAlert][!HideMeter AlertTitle][!HideMeter AlertText][!Redraw]
IfNotMatchAction=[!ShowMeter BgAlert][!ShowMeter AlertTitle][!ShowMeter AlertText][!Redraw]

[mAlertText]
Measure=WebParser
URL=[mAlert]
StringIndex=3

; ============================ STYLES ============================

[styleText]
FontFace=#FontFace#
FontColor=#ColText#
AntiAlias=1
ClipString=1
W=(#PanelW#-2*#Pad#)

; ============================ METERS ============================

; --- Fond du panneau (en-tête identité/machine) ---
[BgHeader]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#PanelW#,#HeaderH#,12 | Fill Color #ColBg# | StrokeWidth 0

[Identity]
Meter=String
MeterStyle=styleText
X=#Pad#
Y=16
FontSize=16
StringStyle=Bold
Text=[mFullname]
DynamicVariables=1

[Machine]
Meter=String
MeterStyle=styleText
X=#Pad#
Y=42
FontSize=11
FontColor=#ColSub#
Text="[mMachine] · [mRoom]"
DynamicVariables=1

; --- Carte d'alerte (sous l'en-tête, couleur selon sévérité) ---
[BgAlert]
Meter=Shape
X=0
Y=(#HeaderH#+8)
Shape=Rectangle 0,0,#PanelW#,58,12 | Fill Color [mAlertSeverity],235 | StrokeWidth 0
DynamicVariables=1

[AlertTitle]
Meter=String
MeterStyle=styleText
X=#Pad#
Y=(#HeaderH#+18)
FontSize=12
StringStyle=Bold
Text=[mAlertTitle]
DynamicVariables=1

[AlertText]
Meter=String
MeterStyle=styleText
X=#Pad#
Y=(#HeaderH#+38)
FontSize=10
Text=[mAlertText]
DynamicVariables=1

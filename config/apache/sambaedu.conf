# Vhost SER (SambaEdu-reload / SE5) — vhost principal port 80.
#
# ATTENTION : ce fichier n'est qu'un FALLBACK utilisé par update.sh quand
# scripts/setupApache.sh est absent/non exécutable. Le chemin nominal passe
# TOUJOURS par setupApache.sh (qui régénère ce vhost ET le vhost legacy port
# 8082 ET appelle setupXsendfile.sh). Garder les deux en phase.
#
# Note : pas de directives XSendFile ici — elles ne sont valides que si
# mod_xsendfile est chargé (sinon Apache refuse de démarrer). setupXsendfile.sh
# s'en charge après avoir vérifié le module. En fallback sans XSendFile, les
# assets OS sont streamés via PHP-FPM (plus lent mais fonctionnel).
<VirtualHost *:80>
	ServerAdmin www-sambaedu@localhost
	ServerName se4fs
	DocumentRoot /var/www/sambaedu-reload/public

	<FilesMatch "\.php$">
		SetHandler "proxy:fcgi://127.0.0.1:9000/"
	</FilesMatch>

	<Directory /var/www/sambaedu-reload/public>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# /ipxe : sert les fichiers statiques volumineux (.wim, .sdi, wimboot, etc.)
	# directement depuis le legacy, .php legacy via FPM, et FallbackResource
	# délègue à Laravel pour les URL sans fichier physique (/ipxe/boot,
	# /ipxe/admin, /ipxe/enrollment/name, etc. — story 3.x + 4.9).
	Alias /ipxe /var/www/sambaedu/ipxe
	<Directory /var/www/sambaedu/ipxe>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
		FallbackResource /index.php
	</Directory>

	ErrorLog /var/log/apache2/sambaedu-reload-error.log
	CustomLog /var/log/apache2/sambaedu-reload-access.log combined
</VirtualHost>

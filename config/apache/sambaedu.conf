<VirtualHost *:80>
	ServerAdmin www-sambaedu@localhost
	ServerName se4fs
	DocumentRoot /var/www/sambaedu/
	
	<FilesMatch "\.php$">
		SetHandler "proxy:fcgi://127.0.0.1:9000/"
	</FilesMatch>
	
	<Directory />
		Options +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>
	
	<Directory /var/www/sambaedu>
		Options -Indexes +FollowSymLinks +MultiViews +ExecCGI
		AllowOverride All
		Require all granted
	</Directory>
	
	<Directory /var/www/sambaedu/api2>
		AllowOverride All
	</Directory>

	<Directory /var/www/sambaedu/central>
		AllowOverride All
	</Directory>

	<Directory /var/www/sambaedu/setup>
		AllowOverride All
	</Directory>
	
	ScriptAlias /cgi-bin/ /usr/lib/cgi-binse/
	
	<Directory "/usr/lib/cgi-binse">
		AllowOverride None
		Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
		Require all granted
	</Directory>
	
	ErrorLog /var/log/apache2/errorse.log
	
	# Possible values include: debug, info, notice, warn, error, crit,
	# alert, emerg.
	LogLevel warn
	
	CustomLog /var/log/apache2/accessse.log combined
	ServerSignature On
	
	Alias /doc/ "/usr/share/doc/"
	<Directory "/usr/share/doc/">
		Options +Indexes +MultiViews +FollowSymLinks
		AllowOverride None
		Require  host 127.0.0.0/255.0.0.0 ::1/128
	</Directory>
	
	Alias /images /var/sambaedu/Docs/images
	<Directory /var/sambaedu/Docs/images>
		AllowOverride None
		Require all granted
	</Directory>
	
	<FilesMatch "diconf/.*\.preseed$">
		Order deny,allow
		Deny from all
		Allow from 192.168.122.0
	</FilesMatch>
	
	Alias /os /var/sambaedu/unattended/install/os
	<Directory /var/sambaedu/unattended/install/os>
		AllowOverride None
		Require all granted
	</Directory>
	# Alias pour les assets Livewire Laravel
	Alias /vendor/livewire /var/www/sambaedu/laravel/public/vendor/livewire
	<Directory /var/www/sambaedu/laravel/public/vendor/livewire>
		Options -Indexes
		AllowOverride None
		Require all granted
	</Directory>

	# Configuration Laravel - AllowOverride All pour .htaccess
	<Directory /var/www/sambaedu/laravel>
		AllowOverride All
	</Directory>
</VirtualHost>
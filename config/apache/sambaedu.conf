# Vhost SER (SambaEdu-reload / SE5) — vhost principal port 80.
#
# ATTENTION : ce fichier n'est qu'un FALLBACK utilisé par update.sh quand
# scripts/setupApache.sh est absent/non exécutable. Le chemin nominal passe
# TOUJOURS par setupApache.sh (qui régénère ce vhost ET le vhost legacy port
# 8082 ET appelle setupXsendfile.sh). Garder les deux en phase.
#
# Note : pas de directives XSendFile ici — elles ne sont valides que si
# mod_xsendfile est chargé (sinon Apache refuse de démarrer). setupXsendfile.sh
# s'en charge après avoir vérifié le module. En fallback sans XSendFile, les
# assets OS sont streamés via PHP-FPM (plus lent mais fonctionnel).
<VirtualHost *:80>
	ServerAdmin www-sambaedu@localhost
	ServerName se4fs
	DocumentRoot /var/www/sambaedu-reload/public

	<FilesMatch "\.php$">
		SetHandler "proxy:fcgi://127.0.0.1:9000/"
	</FilesMatch>

	<Directory /var/www/sambaedu-reload/public>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# /ipxe : sert les fichiers statiques volumineux (.wim, .sdi, wimboot, etc.)
	# directement depuis le legacy, .php legacy via FPM, et FallbackResource
	# délègue à Laravel pour les URL sans fichier physique (/ipxe/boot,
	# /ipxe/admin, /ipxe/enrollment/name, etc. — story 3.x + 4.9).
	Alias /ipxe /var/www/sambaedu/ipxe
	<Directory /var/www/sambaedu/ipxe>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
		FallbackResource /index.php
	</Directory>

	# /assets/shortcut-icons : icônes UPLOADÉES de raccourcis content-addressed
	# (Story 27.7). Servies EN DIRECT (hors FPM/Laravel) ; l'agent fait un GET
	# HTTP simple sur <server_url>/assets/shortcut-icons/<sha256>.ico, vérifie le
	# checksum, écrit local.
	#
	# GARDE-FOU SÉCURITÉ (décision n° 3, piège n° 1) — l'Alias pointe EXACTEMENT
	# sur le sous-dossier dédié storage/app/shortcut-icons, JAMAIS sur storage/
	# entier : storage/keys/pki/ contient le PFX de code-signing + les clés CA et
	# ne doit JAMAIS être servi. Seuls des blobs public-safe (.ico) entrent ici.
	# `Options -Indexes` (dossier non énumérable), PAS de FallbackResource (pas
	# de délégation Laravel : un fichier absent renvoie 404, jamais index.php).
	# Dossier à chown www-admin (uid 599) côté provisioning (lisible Apache).
	Alias /assets/shortcut-icons /var/www/sambaedu-reload/storage/app/shortcut-icons
	<Directory /var/www/sambaedu-reload/storage/app/shortcut-icons>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# /assets/wallpaper : fonds d'écran content-addressed (biblio wallpaper,
	# config wallpapers.library_path = storage/app/wallpaper). Servis EN DIRECT
	# (hors FPM/Laravel) — images de plusieurs centaines de Ko à plusieurs Mo
	# qui n'ont plus à traverser PHP-FPM. L'agent fait un GET HTTP simple sur
	# <server_url>/assets/wallpaper/<sha256>.<ext>, vérifie le checksum, écrit
	# local. Même garde-fou sécu que shortcut-icons : l'Alias pointe EXACTEMENT
	# sur le sous-dossier dédié storage/app/wallpaper, JAMAIS sur storage/ entier
	# (storage/keys/pki/ = PFX code-signing + clés CA). Seuls des blobs
	# public-safe (images) entrent ici. `Options -Indexes` (dossier non
	# énumérable), PAS de FallbackResource (un fichier absent renvoie 404, jamais
	# index.php). Dossier à chown www-admin (uid 599) côté provisioning.
	Alias /assets/wallpaper /var/www/sambaedu-reload/storage/app/wallpaper
	<Directory /var/www/sambaedu-reload/storage/app/wallpaper>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	ErrorLog /var/log/apache2/sambaedu-reload-error.log
	CustomLog /var/log/apache2/sambaedu-reload-access.log combined
</VirtualHost>

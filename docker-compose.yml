services:
  postgres:
    image: postgres:16-alpine
    container_name: se4fs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sambaedu}
      POSTGRES_USER: ${DB_USERNAME:-sambaedu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sambaedu_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sambaedu} -d ${DB_DATABASE:-sambaedu}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

## section 8. Choix des paquets
# gestion de l'environnement kde
#
# inclus par preseed.php dans debian.php

tasksel tasksel/first multiselect standard, desktop, kde-desktop, print-server, ssh-server

d-i pkgsel/include string openssh-server mc vim sambaedu-winbind lightdm sambaedu-linux-stations-common sambaedu-linux-stations-kde
sambaedu-ad-dc sambaedu/admin_passwd password ###_ADMINSE_PASSWD_###
sambaedu-ad-dc sambaedu/admin_passwd_again password ###_ADMINSE_PASSWD_###

#d-i pkgsel/include string openssh-server mc vim sambaedu-ad-client
#d-i pkgsel/include string openssh-server mc vim screen sudo aptitude tofrodos ntp ldap-utils nmap tree zip unzip gnome-tweak-tool conky sambaedu-ad-client
sddm shared/default-x-display-manager    select  lightdm
lightdm shared/default-x-display-manager    select  lightdm



d-i pkgsel/update-policy select none

popularity-contest popularity-contest/participate boolean true


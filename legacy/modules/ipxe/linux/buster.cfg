#in-target wget --no-proxy -P /root/ http://###_SE4FS_IP_###/os/clinux/rejoint_buster_se4_ipxe.sh; \
#in-target chmod +x /root/rejoint_buster_se4_ipxe.sh; \
#in-target /root/rejoint_buster_se4_ipxe.sh

## section 11. Fin de l'installation

d-i finish-install/reboot_in_progress note

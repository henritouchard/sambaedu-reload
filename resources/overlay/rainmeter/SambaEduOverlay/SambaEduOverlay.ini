; Adaptateur RENDER (Windows / Rainmeter) du POC overlay SambaEdu.
;
; Lit le fichier local overlay.json (écrit par overlay-fetch.ps1) et affiche
; identité + machine + la 1re alerte en surcouche. Aucun secret ici : la facade
; = le fichier local.
;
; Parsing par WebParser + regex (zéro dépendance, robuste tant que l'ordre des
; clés du contrat est stable). Pour la liste COMPLÈTE des alertes, préférer la
; variante JsonParser.dll (cf. README) ou Conky côté Linux.
;
; POC — non testé sur poste réel. Cf. resources/overlay/README.md.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=SambaEduOverlay
Author=SambaEdu
Information=POC overlay — lit overlay.json local
Version=0.1-poc

[Variables]
; Chemin du fichier local écrit par l'AGENT desired-state (Story 24.4 — le
; compagnon de session, droits user, est devenu le fetch : il compose et
; écrit overlay.json PER-USER sous %LOCALAPPDATA%). Slashes avant pour
; file:// ; Rainmeter expanse les variables d'environnement Windows dans
; les chemins — si une build ne le faisait pas, remplacer par le chemin
; absolu du profil (C:/Users/<login>/AppData/Local/...).
; Seul ce chemin a changé : le code regex/meters ci-dessous est INCHANGÉ
; (contrat facade overlay.json préservé).
JsonPath=%LOCALAPPDATA%/SambaEdu/Agent/overlay.json
; Cadence de relecture du fichier (× Update 1 s) ≤ ttl_seconds du fetch.
PollSeconds=10
FontFace=Segoe UI

; ============================ MEASURES ============================

; Identité + machine (un seul match, ordre des clés du contrat).
[mIdentity]
Measure=WebParser
URL=file:///#JsonPath#
RegExp=(?siU)"fullname": "(.*)".*"name": "(.*)".*"room": "(.*)".*"alerts":
UpdateRate=#PollSeconds#

[mFullname]
Measure=WebParser
URL=[mIdentity]
StringIndex=1

[mMachine]
Measure=WebParser
URL=[mIdentity]
StringIndex=2

[mRoom]
Measure=WebParser
URL=[mIdentity]
StringIndex=3

; Première alerte (severity / title / text).
[mAlert]
Measure=WebParser
URL=file:///#JsonPath#
RegExp=(?siU)"severity": "(.*)".*"title": "(.*)".*"text": "(.*)"
UpdateRate=#PollSeconds#

[mAlertSeverity]
Measure=WebParser
URL=[mAlert]
StringIndex=1
RegExpSubstitute=1
; severity → couleur RGB.
Substitute="^info$":"50,120,215","^warning$":"230,140,30","^critical$":"200,30,30","^$":"0,0,0"

[mAlertTitle]
Measure=WebParser
URL=[mAlert]
StringIndex=2
; Masque la carte d'alerte quand il n'y a pas d'alerte.
IfMatch=^$
IfMatchAction=[!HideMeter AlertCard][!HideMeter AlertText][!Redraw]
IfNotMatchAction=[!ShowMeter AlertCard][!ShowMeter AlertText][!Redraw]

[mAlertText]
Measure=WebParser
URL=[mAlert]
StringIndex=3

; ============================ METERS ============================

[styleText]
FontFace=#FontFace#
FontColor=255,255,255,255
AntiAlias=1

[Identity]
Meter=String
MeterStyle=styleText
FontSize=16
StringStyle=Bold
Text=[mFullname]
DynamicVariables=1
ClipString=1
W=520

[Machine]
Meter=String
MeterStyle=styleText
FontSize=11
FontColor=255,255,255,190
Y=2R
Text="[mMachine] · [mRoom]"
DynamicVariables=1
ClipString=1
W=520

[AlertCard]
Meter=String
MeterStyle=styleText
FontSize=12
StringStyle=Bold
Y=12R
W=520
H=26
SolidColor=[mAlertSeverity],230
Padding=12,5,12,5
Text=[mAlertTitle]
DynamicVariables=1
ClipString=1

[AlertText]
Meter=String
MeterStyle=styleText
FontSize=10
Y=0R
W=520
H=30
SolidColor=0,0,0,150
Padding=12,5,12,8
Text=[mAlertText]
DynamicVariables=1
ClipString=1

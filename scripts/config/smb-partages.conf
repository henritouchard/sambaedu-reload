# ============================================================================
# SambaEdu — Export SMB des lecteurs réseau gérés (Epic 34)
# ============================================================================
# Déployé par scripts/update.sh:ensure_samba_partages_share() vers
# /etc/samba/smb.conf.d/partages.conf, inclus depuis [global] de
# /etc/samba/smb.conf via une directive `include = <ce fichier>` (un fichier
# PRÉCIS : la directive `include` de smb.conf ne supporte PAS les globs).
#
# Ce partage parent expose la racine des répertoires d'échange. Chaque
# sous-dossier <directory_name> est un répertoire géré dont l'accès RÉEL
# (rw/ro, cloisonnement) est gouverné par l'ACL POSIX posée par
# NetworkShareService::buildAcls() (setfacl), PAS par ce stanza. Le partage
# est donc ouvert en écriture au niveau Samba (`read only = no`) : c'est l'ACL
# du sous-dossier qui tranche au niveau du kernel.
#
# La racine /var/sambaedu/Partages est traversable (other r-x, posée par le
# mkdir -p de NetworkShareService) pour que les participants `ro` — ni
# propriétaire, ni domain admin — atteignent leur sous-dossier. Côté SMB,
# `hide unreadable = Yes` (défini en [global] par le paquet) masque les
# dossiers qu'un utilisateur ne peut pas lire.
#
# NE PAS poser `acl_xattr:ignore system acl = yes` : on s'appuie sur les ACL
# POSIX (kernel), que Samba doit honorer et mapper en NT ACL pour les clients
# Windows. `inherit acls = yes` propage la default ACL aux fichiers créés.
# ============================================================================
[partages]
    comment = Partages gérés SE5 — lecteurs réseau (Epic 34)
    path = /var/sambaedu/Partages
    read only = no
    inherit acls = yes
    vfs objects = acl_xattr
